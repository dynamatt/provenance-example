# Requirements Spec §4a — Document is an ordinary schema-defined entity type,
# not a special built-in concept. Its body (not shown in schema) interleaves
# prose with query blocks (High-Level Design §4.3a) — see DOC/DOC-0001.md.
type: Document
id_prefix: DOC
fields:
  - name: title
    type: string
    required: true
  - name: status
    type: ApprovalStatus
    default: draft
