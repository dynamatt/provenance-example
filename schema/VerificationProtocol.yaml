# provenance-ddf REQ-0004 — Verification Protocol, linked to the requirement(s) it verifies.
type: VerificationProtocol
id_prefix: VER
fields:
  - name: title
    type: string
    required: true
  - name: procedure
    type: text
    body: true
    required: true
  # The procedure as a sequence of steps, each with what passes it. Steps
  # carry no number: templates/VerificationProtocol.tmpl numbers them by
  # position, and Verification Evidence records a result for each step at
  # the same position (VerificationEvidence.step_results).
  - name: steps
    type: list
    fields:
      - name: description
        type: text
        required: true
      - name: acceptance_criteria
        type: text
        required: true
  - name: status
    type: ApprovalStatus
    required: true
  # Declared here, on the later artefact: adding verification never edits the
  # requirement. Requirements see it as the derived `verified_by` facet.
  - name: verifies
    type: link
    target: [Requirement]
    cardinality: many
    reverse_name: verified_by
  # What the protocol is run on, and with: each is an entity so a document
  # can list every device under test and every piece of equipment once,
  # across all its protocols (DOC-0004).
  - name: device_under_test
    type: link
    target: [Component]
    cardinality: many
    reverse_name: test_protocols
    required: true
  - name: equipment_needed
    type: link
    target: [TestEquipment]
    cardinality: many
    reverse_name: needed_by
