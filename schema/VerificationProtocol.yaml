# provenance-ddf REQ-0004 — Verification Protocol, linked to the requirement(s) it verifies.
type: VerificationProtocol
id_prefix: VER
fields:
  - name: title
    type: string
    title: true
    required: true
  - name: procedure
    type: text
    body: true
    required: true
  # The procedure as a sequence of steps, each with what passes it. Steps
  # carry no number: templates/VerificationProtocol.tmpl numbers them by
  # position, and Verification Evidence records a result for each step at
  # the same position (VerificationEvidence.step_results).
  - name: steps
    type: list
    fields:
      - name: description
        type: text
        required: true
      - name: acceptance_criteria
        type: text
        required: true
  - name: status
    type: ApprovalStatus
    required: true
  # Who approved the protocol, and when (provenance-ddf DES-0058). Until
  # `provenance sign` exists an approval is the record's own data: a row a
  # person committed, not an electronic signature. The protocol is approved
  # again after every change to its procedure or steps
  # (rules/approval-current.yaml), and evidence is run or justified after its
  # protocol's latest approval (rules/evidence-after-approval.yaml).
  - name: approvals
    type: list
    fields:
      - name: approver
        type: string
        required: true
      - name: date
        type: date
        required: true
      - name: meaning
        type: string
        required: true
  - name: approved_on
    type: calculated
    friendly_name: Approved on
    formula: "MAX(approvals[].date)"
  # Declared here, on the later artefact: adding verification never edits the
  # requirement. Requirements see it as the derived `verified_by` facet.
  - name: verifies
    type: link
    target: [Requirement]
    cardinality: many
    reverse_name: verified_by
  # What the protocol is run on, and with: each is an entity so a document
  # can list every device under test and every piece of equipment once,
  # across all its protocols (DOC-0004).
  - name: device_under_test
    type: link
    target: [Component]
    cardinality: many
    reverse_name: test_protocols
    required: true
  - name: equipment_needed
    type: link
    target: [TestEquipment]
    cardinality: many
    reverse_name: needed_by
