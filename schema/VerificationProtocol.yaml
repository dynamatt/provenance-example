# provenance-ddf REQ-0004 — Verification Protocol, linked to the requirement(s) it verifies.
type: VerificationProtocol
id_prefix: VER
fields:
  - name: title
    type: string
    required: true
  - name: procedure
    type: text
    body: true
    required: true
  - name: current_version
    type: number
    required: true
    default: 1
    help: "Bumped whenever the procedure changes materially; Verification Evidence records which version it was executed against."
  - name: status
    type: ApprovalStatus
    default: draft
  # Declared here, on the later artefact: adding verification never edits the
  # requirement. Requirements see it as the derived `verified_by` facet.
  - name: verifies
    type: link
    target: [Requirement]
    cardinality: many
    reverse_name: verified_by
  - name: order
    type: number
