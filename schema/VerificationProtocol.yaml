# Requirements Spec §2 — Verification Protocol, linked to the requirement(s) it verifies.
type: VerificationProtocol
id_prefix: VER
fields:
  - name: title
    type: string
    required: true
  - name: procedure
    type: text
    body: true
    required: true
  - name: current_version
    type: number
    required: true
    default: 1
    help: "Bumped whenever the procedure changes materially; Verification Evidence records which version it was executed against."
  - name: status
    type: ApprovalStatus
    default: draft
  # No `verifies` field here: the link is declared once, on its source side,
  # as Requirement.verified_by with reverse_name `verifies` (Detailed Design
  # §6). A protocol's `verifies` facet is derived from that declaration.
  - name: order
    type: number
