# provenance-ddf REQ-0004 — decomposed hierarchically, User Needs -> System -> Subsystem/Component.
type: Requirement
id_prefix: REQ
fields:
  - name: title
    type: string
    required: true
  - name: statement
    type: text
    body: true
    required: true
    help: "The shall-statement. Ref: ISO 13485 §7.3.3"
  - name: rationale
    type: text
  # A list of an enum: each item is one of VerificationMethod's values.
  - name: verification_methods
    type: list
    of: VerificationMethod
  - name: status
    type: ApprovalStatus
    default: draft
  - name: implements
    type: link
    target: [UserNeed]
    cardinality: many
    reverse_name: implemented_by
  # No `verified_by` field here: a requirement is written first and must not
  # change when verification is added, so the link is declared on the later
  # artefact, VerificationProtocol.verifies (reverse_name `verified_by`).
  - name: parent_requirement
    type: link
    target: [Requirement]
    cardinality: one
    reverse_name: child_requirements
    help: "Decomposition link — e.g. a Subsystem requirement's parent is the System requirement it refines."
  - name: supersedes
    type: link
    target: [Requirement]
    cardinality: one
    reverse_name: superseded_by
    help: "Set when this Requirement replaces a released, content-frozen Requirement (see Content Frozen After Release, rules/content-frozen-requirement.yaml)."
  - name: order
    type: number
