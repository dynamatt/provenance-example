# provenance-ddf REQ-0004 — Verification Evidence: execution results, linked to
# a specific protocol version. Deliberately a different id_prefix (EVD) from
# VerificationProtocol (VER) even though both live under VER/ by folder
# convention (provenance-ddf DES-0006: folder placement is convention, not the ID
# source) — sharing a prefix would make IDs ambiguous about which type they
# name.
type: VerificationEvidence
id_prefix: EVD
fields:
  - name: title
    type: string
    required: true
  - name: tests
    type: link
    target: [VerificationProtocol]
    cardinality: one
    reverse_name: tested_by
  # The build the protocol was executed on: which version of the device
  # under test this evidence is for (DOC-0005).
  - name: build_tested
    type: link
    target: [BuildStandard]
    cardinality: one
    reverse_name: tested_by
    required: true
  # The protocol has no version number of its own: its versions are its git
  # history. The evidence names a commit of this repository holding the
  # protocol exactly as executed. Checking that the protocol has not changed
  # since needs git facts in queries, which are not yet designed
  # (provenance-ddf DES-0016, OPEN).
  - name: protocol_commit
    type: string
    required: true
    help: "Full SHA of a commit of this repository containing the protocol as executed."
  - name: execution_date
    type: date
    required: true
  - name: result
    type: PassFail
    required: true
  # One row per step of the protocol, in the protocol's order: row n is the
  # result of step n. The step's description and acceptance criteria are not
  # copied here; templates/VerificationEvidence.tmpl reads them from the
  # protocol through `tests` — as it is now, not at protocol_commit. A
  # protocol revised after execution would show its new steps beside the old
  # results; catching that is the staleness check still to be designed
  # (see protocol_commit above).
  - name: step_results
    type: list
    fields:
      - name: result
        type: text
        required: true
        help: "What was observed or measured at this step."
      - name: pass_fail
        type: PassFail
        required: true
  - name: notes
    type: text
    body: true
  # List field: a frozen, point-in-time record of equipment used — a later
  # recalibration of the real equipment must not retroactively change what
  # this report correctly documented (provenance-ddf REQ-0031's List-vs-link
  # guidance, using its own worked example). Its rows are the named record
  # schema/records/Equipment.yaml rather than inline fields; compare
  # Risk.failure_modes, whose row shape is declared inline.
  - name: equipment_used
    type: list
    of: Equipment
