# A captioned entity (Requirements Spec §2, §7): numbered "Figure N" in each
# document that embeds it, in document order. Numbering is presentation, so
# which types are numbered, and in which sequence, is set in
# templates/_captions.yaml, not here. The body is the figure itself: an
# inline SVG keeps the site free of external assets (Requirements Spec §7).
type: Figure
id_prefix: FIG
fields:
  - name: title
    type: string
    required: true
    help: "The caption text, shown after the figure's number."
  - name: status
    type: ApprovalStatus
    default: draft
