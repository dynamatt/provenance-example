# A known anomaly (IEC 62304 §5.8.3, §9), one row of the issue tracker's
# export (provenance-ddf DES-0053). The tracker gives each anomaly its key;
# each row links out to the requirements it affects, IDs separated by ";"
# in one cell. pages: false (provenance-ddf DES-0054): anomalies get no
# page each; they are shown together on the Anomaly page, which
# templates/_Anomaly.tmpl lays out.
type: Anomaly
id_prefix: BUG
pages: false
source:
  csv: data/anomalies.csv
  id: Key
fields:
  - name: title
    type: string
    column: Summary
    required: true
  - name: severity
    type: AnomalySeverity
    column: Severity
  - name: affects
    type: link
    target: [Requirement]
    cardinality: many
    reverse_name: anomalies
    column: Requirements
  # .resolved in a template; the engine's .Resolved (whether a link
  # resolves) is another key (provenance-ddf DES-0030).
  - name: resolved
    type: boolean
    column: Resolved
  - name: found
    type: date
    column: Created
  - name: notes
    type: text
    column: Description
