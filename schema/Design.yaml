# Requirements Spec §2 — System Architecture down to subcomponents.
type: Design
id_prefix: DES
fields:
  - name: title
    type: string
    required: true
  - name: description
    type: text
    body: true
    required: true
  - name: status
    type: ApprovalStatus
    default: draft
  - name: implements
    type: link
    target: [Requirement]
    cardinality: many
    reverse_name: implemented_by
  # A list of a built-in type: one string per item, no row fields.
  - name: standards
    type: list
    of: string
    help: "Standards this design element is designed to comply with."
  - name: order
    type: number
