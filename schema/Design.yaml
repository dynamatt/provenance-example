# provenance-ddf REQ-0004 — System Architecture down to subcomponents.
type: Design
id_prefix: DES
fields:
  - name: title
    type: string
    title: true
    required: true
  - name: description
    type: text
    body: true
    required: true
  - name: status
    type: ApprovalStatus
    required: true
  - name: implements
    type: link
    target: [Requirement]
    cardinality: many
    reverse_name: implemented_by
  # A list of a built-in type: one string per item, no row fields.
  - name: standards
    type: list
    of: string
    help: "Standards this design element is designed to comply with."
  # The same, as links to the standards register (data/standards.csv, a
  # table kept by hand; provenance-ddf DES-0053).
  - name: complies_with
    type: link
    target: [Standard]
    cardinality: many
    reverse_name: applied_by
  - name: order
    type: number
