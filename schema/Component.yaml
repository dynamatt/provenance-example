# A part of the device that can be put under test: the system itself or one
# of its subassemblies. Not to be confused with a Provenance component — the
# repository named in `.component` (provenance-ddf DES-0005): this is a
# part of the product, an entity like any other.
#
# A Component is the design-level part; what is actually built and tested is
# one of its build standards (BuildStandard.component, reverse `builds`).
type: Component
id_prefix: CMP
fields:
  - name: title
    type: string
    title: true
    required: true
  - name: part_number
    type: string
    required: true
  - name: description
    type: text
    body: true
    required: true
  - name: status
    type: ApprovalStatus
    required: true
  # The breakdown of the system: each component but the system itself is a
  # part of another. A Verification Summary Report walks it down from the
  # components its scope selects, a section per component and a subsection
  # per subcomponent (templates/requirements-of-component.tmpl).
  - name: parent
    type: link
    target: [Component]
    cardinality: one
    reverse_name: subcomponents
