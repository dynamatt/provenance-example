# provenance-ddf DES-0010 — a document type written once and used for every
# report of its kind. It extends Document: it has Document's title and
# status, numbers in Document's series (DOC-, having no id_prefix of its
# own), and wherever Document is named (a link's target, from: in a query)
# a report is a Document too. Its template, templates/
# VerificationSummaryReport.tmpl, fills a block of Document.tmpl, so a
# report keeps the Document layout and adds its traceability matrix.
type: VerificationSummaryReport
extends: Document
fields:
  # The requirement a report is about, when it is about one: the report
  # then covers it and the requirements refining it, through ^covers in
  # its scope's query (DOC-0007). Left out by a report whose scope says
  # what it covers outright (DOC-0006).
  - name: covers
    type: link
    target: [Requirement]
    cardinality: one
  # The requirements the report covers, as a query the report states
  # (provenance-ddf DES-0010, DES-0032): its results are a many-link the
  # template lays out, re-run at every export, so the scope can't fall
  # behind the requirements it describes. Requirements see the reports
  # covering them as reported_in.
  - name: scope
    type: query
    of: [Requirement]
    reverse_name: reported_in
    required: true
  - name: requirement_count
    type: calculated
    formula: COUNT(scope)
