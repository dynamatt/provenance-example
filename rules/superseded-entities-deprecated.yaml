# Rule type: Query Assertion — link-existence check via `exists`, enforcing
# the supersession-pairing convention Content Frozen After Release's
# remediation note describes (Requirements Spec §6).
id: superseded-entities-deprecated
rule: QueryAssertion
severity: error
message: "entity has been superseded but its status is not Deprecated"
from: Requirement
where:
  - field: superseded_by
    operator: exists
  - field: status
    operator: not_equals
    value: deprecated
