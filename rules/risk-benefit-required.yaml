# A field required only under a condition (provenance-ddf REQ-0042): the
# condition and `missing` together.
severity: error
message: "risk-benefit analysis required when residual acceptability is unacceptable"
from: Risk
where:
  - field: residual_acceptability
    operator: equals
    value: unacceptable
  - field: risk_benefit_analysis
    operator: missing
