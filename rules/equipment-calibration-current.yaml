# A sub-query on a list field tests each row on its own, so each row that
# fails is reported at its line, not just the evidence as a whole
# (provenance-ddf REQ-0045, DES-0015). ^execution_date is the evidence's own
# field, read from inside the row.
#
# from: Evidence names an abstract type, which stands for every type
# extending it (provenance-ddf DES-0010): one rule checks verification and
# validation evidence alike, where each once needed a rule of its own.
severity: error
message: "equipment calibration was not current at the time of execution"
from: Evidence
where:
  field: equipment_used
  where:
    field: calibration_due_date
    operator: less_than
    value_of: ^execution_date
