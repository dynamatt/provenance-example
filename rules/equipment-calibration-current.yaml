# A sub-query on a list field tests each row on its own, so each row that
# fails is reported at its line, not just the evidence as a whole
# (provenance-ddf REQ-0045, DES-0015). ^execution_date is the evidence's own
# field, read from inside the row.
severity: error
message: "equipment calibration was not current at time of test execution"
from: VerificationEvidence
where:
  field: equipment_used
  where:
    field: calibration_due_date
    operator: less_than
    value_of: ^execution_date
