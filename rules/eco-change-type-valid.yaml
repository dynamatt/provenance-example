# Checks change_type against an allowed list, since that field is a plain
# string rather than a named enum (see schema/ChangeRequest.yaml's comment on
# that tradeoff). not_in also matches a ChangeRequest with no change_type.
severity: error
message: "change_type must be one of the approved categories"
from: ChangeRequest
where:
  field: change_type
  operator: not_in
  value: [correction, enhancement, safety]
