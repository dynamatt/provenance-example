# A protocol whose procedure or steps changed after its latest approval
# (provenance-ddf DES-0058): it must be approved again before it is run.
# approved_on is the latest approval's date. A change and an approval on the
# same day count as approved: a date is a day.
severity: error
message: "the procedure or steps changed after the latest approval"
from: VerificationProtocol
where:
  field: changes
  where:
    - field: kind
      operator: equals
      value: changed
    - any_of:
        - {field: fields, operator: equals, value: procedure}
        - {field: fields, operator: equals, value: steps}
    - field: date
      operator: greater_than
      value_of: ^approved_on
