# Applies to the parent_requirement decomposition link
# (schema/Requirement.yaml): a requirement that is its own ancestor
# (provenance-ddf REQ-0046). Every requirement on the cycle is reported.
severity: error
message: "requirement decomposition hierarchy contains a cycle"
from: Requirement
where:
  field: parent_requirement
  transitive: true
  where:
    field: id
    operator: equals
    value_of: ^id
